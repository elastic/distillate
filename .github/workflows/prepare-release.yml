name: Prepare a Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      # Runs the same `.releaserc.json` the publish uses, so both compute the same version.
      # `@semantic-release/npm` still exchanges the OIDC token here, which checks trusted
      # publishing before anyone reviews the release.
      - name: Compute the changelog and version
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: node scripts/prepare_release.js

      # The org `Require a PR` ruleset also covers `release/*`, so the branch is
      # `chore/release-v<version>`.
      - name: Open the release pull request
        if: ${{ steps.prepare.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          branch="chore/release-v${VERSION}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add CHANGELOG.md package.json
          git commit -m "chore(release): ${VERSION}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${branch}"

          body="${RUNNER_TEMP}/pull-request-body.md"
          {
            printf 'Prepared by [`prepare-release.yml`](%s/%s/actions/runs/%s).\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Merge this, then run **Publish a Release** with `dry_run: false` to tag `v%s`, publish to npm, and create the GitHub Release. Nothing is published until then.\n\n---\n\n' \
              "$VERSION"
            cat "$RELEASE_NOTES_FILE"
          } > "$body"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" --title "chore(release): ${VERSION}" --body-file "$body"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(release): ${VERSION}" \
              --body-file "$body"
          fi
