name: okf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  OKF_VERSION: 0.3.0
  OKF_SHA256: 43b4eb96974d409cc228326bf7976217391454b7d98f18016b00104cf5777509
  BUNDLE: .okf/distillate

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install okf
        run: |
          curl -fsSL -o okf.tar.gz \
            "https://github.com/okfcli/okf/releases/download/v${OKF_VERSION}/okf_${OKF_VERSION}_linux_amd64.tar.gz"
          echo "${OKF_SHA256}  okf.tar.gz" | sha256sum --check --strict
          tar -xzf okf.tar.gz okf
          install -m 0755 okf /usr/local/bin/okf
          okf version

      - name: Validate
        run: okf validate "$BUNDLE"

      - name: Check for stale concepts
        run: |
          okf lint "$BUNDLE" > okf-lint.json
          python3 - <<'PY'
          import json, sys

          findings = json.load(open('okf-lint.json'))['findings']
          for finding in findings:
              print(f"::warning title=okf {finding['rule']}::{finding['concept_id']}: {finding['message']}")

          stale = [finding for finding in findings if finding['rule'] == 'okf/lifecycle/stale']
          if stale:
              print(
                  f"::error::{len(stale)} concept(s) are past stale_after. "
                  'Re-verify each against code, then extend the date or fix the content.'
              )
              sys.exit(1)
          PY

      - name: Check index freshness
        run: |
          okf index "$BUNDLE" > /dev/null
          if ! git diff --exit-code -- "$BUNDLE"; then
            echo "::error::Generated indexes are stale. Run 'okf index $BUNDLE' and commit the result."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # This job only runs `node` scripts; skip lockfile-based pnpm cache lookup.
          package-manager-cache: false

      - name: Check OKF map freshness
        run: node scripts/write_okf_map.js --check

      - name: Check cited repo paths still resolve
        run: node scripts/check_okf_anchors.js
