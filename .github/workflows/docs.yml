name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build docs and playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:api
      - name: Build docs
        uses: elastic/docs-builder@main
      - name: Build playground
        run: pnpm playground:build
        env:
          # Relative paths work on both the unique private host and elastic.github.io/distillate/.
          PLAYGROUND_BASE: ./
      - name: Copy playground into docs output
        run: |
          mkdir -p .artifacts/docs/html/playground
          cp -R docs/playground/dist/. .artifacts/docs/html/playground/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: .artifacts/docs/html

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
