# Elastic Internal Docs (Codex) per-PR preview. This file's path is bound to
# the token-policy-push-codex-link-index-distillate policy in
# elastic/catalog-info and to the vault role codex/build@v1 derives from it,
# so do not rename it.
#
# This inlines elastic/docs-actions/.github/workflows/codex-preview.yml@v1
# rather than calling it, so pnpm docs:api (typedoc) can run before the
# build and the playground can be copied into the output after: the
# reusable workflow checks out, builds, and uploads in one step with no
# hook for either.
name: elastic-internal-docs

on:
  push:
    branches:
      - main
  pull_request: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    permissions:
      pull-requests: read
      contents: read
    runs-on: ubuntu-slim
    outputs:
      any_modified: ${{ steps.check-files.outputs.any_modified }}
      all_changed_files: ${{ steps.check-files.outputs.all_changed_files }}
    steps:
      - name: Checkout
        if: contains(fromJSON('["push", "merge_group", "workflow_dispatch"]'), github.event_name)
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check changes
        id: check-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            docs/**
            src/**
          files_ignore: |
            .github/**
            README.md

  build:
    needs: check
    outputs:
      path_prefix: ${{ steps.codex-build.outputs.path-prefix }}
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ needs.check.outputs.any_modified == 'true' && 'ubuntu-latest' || 'ubuntu-slim' }}
    steps:
      - name: Checkout code
        if: needs.check.outputs.any_modified == 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: needs.check.outputs.any_modified == 'true'
      - uses: actions/setup-node@v5
        if: needs.check.outputs.any_modified == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: needs.check.outputs.any_modified == 'true'
        run: pnpm install --frozen-lockfile
      - name: Generate API docs
        if: needs.check.outputs.any_modified == 'true'
        run: pnpm docs:api
      - uses: elastic/docs-actions/codex/build@v1
        if: needs.check.outputs.any_modified == 'true'
        id: codex-build
      - name: Build playground
        if: needs.check.outputs.any_modified == 'true'
        run: pnpm playground:build
        env:
          PLAYGROUND_BASE: ${{ steps.codex-build.outputs.path-prefix }}/playground/
      - name: Copy playground into docs output
        if: needs.check.outputs.any_modified == 'true'
        run: |
          mkdir -p .artifacts/docs/html/playground
          cp -R docs/playground/dist/. .artifacts/docs/html/playground/
      - name: Re-upload docs with playground
        if: needs.check.outputs.any_modified == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: .artifacts/docs/html
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      - name: Warn about fork PR
        if: >
          startsWith(github.event_name, 'pull_request')
          && github.event.pull_request.head.repo.full_name != github.repository
          && needs.check.outputs.any_modified == 'true'
        run: |
          echo "::warning::Preview deployments are only available for PRs from the same repository, not from forks." \
            "You can either change the event to pull_request_target or push the branch to the upstream repository instead."
      - name: Skip build
        if: needs.check.outputs.any_modified == 'false'
        run: |
          echo "::warning::No changes detected, skipping build."

  deploy:
    if: >
      needs.check.outputs.any_modified == 'true'
      && contains(fromJSON('["pull_request", "pull_request_target"]'), github.event_name)
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      deployments: write
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Create Deployment
        uses: actions/github-script@v9
        id: deployment
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const prNumber = process.env.PR_NUMBER;
            const environment = 'codex-preview';
            const task = prNumber ? `codex-preview-${prNumber}` : undefined;
            const deployment = await github.rest.repos.createDeployment({
                owner,
                repo,
                environment,
                task,
                ref: process.env.REF,
                auto_merge: false,
                transient_environment: true,
                required_contexts: [],
            })
            await github.rest.repos.createDeploymentStatus({
                deployment_id: deployment.data.id,
                owner,
                repo,
                state: "in_progress",
                log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            return deployment.data.id
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF: ${{ startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.sha || github.ref_name }}
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: docs
      - name: Reject symlinks in build output
        run: |
          if find docs -type l | grep -q .; then
            echo "::error::Symlinks found in build output — refusing to deploy"
            find docs -type l -ls
            exit 1
          fi
      - uses: elastic/docs-actions/aws/auth@v1
        with:
          aws_role_name_prefix: codex-eng-preview-
      - name: AWS sync docs to S3
        id: s3-upload
        run: |
          aws configure set default.s3.max_concurrent_requests "${AWS_CLI_S3_MAX_CONCURRENT_REQUESTS}"
          aws configure set default.s3.max_queue_size "${AWS_CLI_S3_MAX_QUEUE_SIZE}"
          aws s3 sync docs "s3://elastic-codex-website-internal${PATH_PREFIX}" --delete --no-follow-symlinks --only-show-errors
          aws cloudfront create-invalidation \
            --distribution-id E1BSBYLPE05D2R \
            --paths "${PATH_PREFIX}" "${PATH_PREFIX}/*"
        env:
          PATH_PREFIX: ${{ needs.build.outputs.path_prefix }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 3
          AWS_CLI_S3_MAX_CONCURRENT_REQUESTS: 32
          AWS_CLI_S3_MAX_QUEUE_SIZE: 10000
      - name: Update deployment status
        uses: actions/github-script@v9
        if: always() && steps.deployment.outputs.result
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PATH_PREFIX: ${{ needs.build.outputs.path_prefix }}
        with:
          script: | # zizmor: ignore[template-injection] deployment_id from prior step output
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: "${{ steps.s3-upload.outcome == 'success' && 'success' || 'failure' }}",
              environment_url: `https://codex.elastic.dev${process.env.PATH_PREFIX}`,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

  update-link-index:
    needs:
      - build
      - check
    permissions:
      id-token: write
    if: >
      needs.check.outputs.any_modified == 'true'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name)
      && github.event.repository.fork == false
    runs-on: ubuntu-slim
    steps:
      - uses: elastic/docs-actions/codex/update-link-index@v1
        with:
          codex-env: internal
