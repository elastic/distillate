name: Publish a Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (do not publish)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: node -v && npm -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # Nothing here writes to main. The changelog and version bump land first, through the pull
      # request that `prepare-release.yml` opens; this tags, publishes to npm, and drafts the
      # GitHub Release. `semantic_release_verify_version.js` fails the run if the two disagree.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
