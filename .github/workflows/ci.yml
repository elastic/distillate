name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
      - name: Check package exports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm smoke:exports
      - name: Check emitted declarations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm smoke:declarations
      - name: Check license report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm licenses:report --check
